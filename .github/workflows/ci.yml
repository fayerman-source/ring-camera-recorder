name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts (a supply-chain
      # foothold: any transitive dep can run arbitrary code at install time).
      # Three deps ship install scripts — esbuild, ffmpeg-for-homebridge and
      # protobufjs — and all three only fetch or build binaries that this job
      # does not use: it type-checks and runs the hermetic tests, which touch
      # neither ffmpeg nor tsx. Nothing is rebuilt on purpose. If a future test
      # needs a real ffmpeg, rebuild that one package explicitly rather than
      # dropping this flag.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check / build
        run: npm run build

      - name: Run hermetic tests
        run: npm test
